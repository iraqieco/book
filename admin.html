<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - عراقي إيكو</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-control { width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0066cc; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background: #004d99; }
        .btn-danger { background: #cc0000; }
        .btn-danger:hover { background: #990000; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; font-size: 14px; }
        th { background: #0066cc; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" style="color:#0066cc; text-decoration:none;">← العودة إلى الموقع الرئيسي</a>
        
        <!-- نموذج تسجيل الدخول -->
        <div id="loginSection" style="margin-top: 30px; text-align: center; max-width: 400px; margin-left: auto; margin-right: auto;">
            <h2>تسجيل دخول المخول</h2>
            <p>أدخل بيانات الحساب المسجل في قاعدة البيانات:</p>
            <input type="email" id="adminEmail" class="form-control" placeholder="البريد الإلكتروني">
            <input type="password" id="adminPassword" class="form-control" placeholder="كلمة المرور">
            <button id="loginBtn">تسجيل الدخول</button>
            <p id="loginError" style="color:red; margin-top:10px;"></p>
        </div>

        <!-- لوحة التحكم -->
        <div id="adminPanel" style="display:none; margin-top: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="formTitle">إضافة كائن حي جديد</h2>
                <button id="logoutBtn" style="background:#555; padding:6px 12px; font-size:13px;">تسجيل الخروج</button>
            </div>
            
            <input type="hidden" id="editOrgId">
            
            <label>الاسم العربي:</label>
            <input type="text" id="nameAr" class="form-control">
            
            <label>الاسم العلمي / اللاتيني:</label>
            <input type="text" id="scientificName" class="form-control">
            
            <label>المملكة:</label>
            <input type="text" id="kingdom" class="form-control">
            
            <label>الصنف (Class):</label>
            <input type="text" id="orgClass" class="form-control">
            
            <label>حالة الحفظ:</label>
            <input type="text" id="conservationStatus" class="form-control">
            
            <label>الوصف:</label>
            <textarea id="description" rows="4" class="form-control"></textarea>
            
            <label>رابط صورة خارجي (يحفظ في عمود image):</label>
            <input type="url" id="imageUrl" class="form-control" placeholder="https://...">

            <label>رابط خريطة التوزيع (يحفظ في العمود "1"):</label>
            <input type="url" id="mapUrlInput" class="form-control" placeholder="https://...">
            
            <label>المراجع والمصادر:</label>
            <textarea id="references" rows="2" class="form-control"></textarea>

            <button id="saveOrgBtn">حفظ البيانات</button>
            <button id="cancelEditBtn" style="background:#888; display:none;">إلغاء التعديل</button>

            <hr style="margin: 30px 0;">

            <h3>إدارة الكائنات المسجلة</h3>
            <!-- شريط البحث الخاص بلوحة التحكم -->
            <input type="text" id="adminSearchInput" class="form-control" placeholder="ابحث في الكائنات للتعديل أو الحذف بسرعة...">

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم العربي</th>
                        <th>الاسم العلمي</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://rmqtopxawrrgntcqqnpa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcXRvcHhhd3JyZ250Y3FxbnBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3OTIxMzQsImV4cCI6MjA5ODM2ODEzNH0.HoExHY9oNFdryWUC2u2UELLPfBNhH3P4L3zS03dvELA';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allOrganisms = [];

        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) showPanel();
        });

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('loginError').innerText = 'خطأ في تسجيل الدخول: ' + error.message;
            } else {
                showPanel();
            }
        };

        document.getElementById('logoutBtn').onclick = async () => {
            await supabase.auth.signOut();
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        };

        function showPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminData();
        }

        // دالة لجلب كافة البيانات دفعة بعد دفعة (لتجاوز حد 1000 نتيجة)
        async function fetchAllOrganisms() {
            let allData = [];
            let limit = 1000;
            let from = 0;
            let hasMore = true;

            while (hasMore) {
                const { data, error } = await supabase
                    .from('organisms')
                    .select('*')
                    .range(from, from + limit - 1);

                if (error) {
                    console.error('خطأ في جلب البيانات:', error);
                    break;
                }

                if (data && data.length > 0) {
                    allData = allData.concat(data);
                    if (data.length < limit) {
                        hasMore = false;
                    } else {
                        from += limit;
                    }
                } else {
                    hasMore = false;
                }
            }
            return allData;
        }

        async function loadAdminData() {
            allOrganisms = await fetchAllOrganisms();
            renderAdminTable(allOrganisms);
        }

        function renderAdminTable(items) {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">لا توجد نتائج مطابقة.</td></tr>';
                return;
            }

            items.forEach((org, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${org.name_ar || ''}</td>
                    <td><i>${org.scientific_name || ''}</i></td>
                    <td>
                        <button onclick="window.editOrg('${org.id}')">تعديل</button>
                        <button class="btn-danger" onclick="window.deleteOrg('${org.id}')">حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // تفعيل البحث داخل لوحة التحكم
        document.getElementById('adminSearchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allOrganisms.filter(o => 
                (o.name_ar && o.name_ar.toLowerCase().includes(term)) || 
                (o.scientific_name && o.scientific_name.toLowerCase().includes(term))
            );
            renderAdminTable(filtered);
        });

        document.getElementById('saveOrgBtn').onclick = async () => {
            const id = document.getElementById('editOrgId').value;
            const payload = {
                name_ar: document.getElementById('nameAr').value,
                scientific_name: document.getElementById('scientificName').value,
                kingdom: document.getElementById('kingdom').value,
                class: document.getElementById('orgClass').value,
                conservation_status: document.getElementById('conservationStatus').value,
                description: document.getElementById('description').value,
                image: document.getElementById('imageUrl').value,
                '1': document.getElementById('mapUrlInput').value,
                references: document.getElementById('references').value
            };

            if (id) {
                const { error } = await supabase.from('organisms').update(payload).eq('id', id);
                if (error) alert('خطأ: ' + error.message);
                else alert('تم التعديل بنجاح');
            } else {
                const { error } = await supabase.from('organisms').insert([payload]);
                if (error) alert('خطأ: ' + error.message);
                else alert('تمت الإضافة بنجاح');
            }

            resetForm();
            loadAdminData();
        };

                window.editOrg = async function(id) {
            // استخدام == بدلاً من === لضمان مطابقة الـ id سواء كان نصاً أو رقماً
            const org = allOrganisms.find(o => o.id == id);
            if (!org) return;

            document.getElementById('editOrgId').value = org.id;
            document.getElementById('nameAr').value = org.name_ar || '';
            document.getElementById('scientificName').value = org.scientific_name || '';
            document.getElementById('kingdom').value = org.kingdom || '';
            document.getElementById('orgClass').value = org.class || '';
            document.getElementById('conservationStatus').value = org.conservation_status || '';
            document.getElementById('description').value = org.description || '';
            document.getElementById('imageUrl').value = org.image || '';
            document.getElementById('mapUrlInput').value = org['1'] || '';
            document.getElementById('references').value = org.references || '';

            document.getElementById('formTitle').innerText = 'تعديل بيانات الكائن الحي';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };


        window.deleteOrg = async function(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                const { error } = await supabase.from('organisms').delete().eq('id', id);
                if (error) alert('خطأ: ' + error.message);
                else loadAdminData();
            }
        };

        document.getElementById('cancelEditBtn').onclick = () => resetForm();

        function resetForm() {
            document.getElementById('editOrgId').value = '';
            document.getElementById('nameAr').value = '';
            document.getElementById('scientificName').value = '';
            document.getElementById('kingdom').value = '';
            document.getElementById('orgClass').value = '';
            document.getElementById('conservationStatus').value = '';
            document.getElementById('description').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('mapUrlInput').value = '';
            document.getElementById('references').value = '';
            document.getElementById('formTitle').innerText = 'إضافة كائن حي جديد';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }
    </script>
</body>
</html>
