<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الكائنات الحية في العراق</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        .search-box { width: 100%; max-width: 600px; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; display: block; margin: 0 auto 15px auto; }
        
        table { width: 100%; max-width: 1100px; margin: 0 auto; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        th, td { border: 1px solid #e1e1e1; padding: 12px; text-align: right; font-size: 14px; }
        th { background: #0066cc; color: white; }
        tr:nth-child(even) { background: #fdfdfd; }
        tr:hover { background: #f1f7ff; }
        .scientific-col { font-style: italic; color: #555; }
        .admin-link { position: absolute; top: 15px; left: 15px; color: #0066cc; text-decoration: none; font-size: 14px; }
        .admin-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <a href="admin.html" class="admin-link">تسجيل دخول المخول (لوحة التحكم)</a>
    
    <header>
        <h1>الكائنات الحية في العراق</h1>
        <p>قائمة توثيقية بيئية متسلسلة</p>
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث بالاسم العربي أو العلمي...">
    </header>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>الاسم العربي</th>
                <th>الاسم العلمي</th>
                <th>المملكة</th>
                <th>الصنف</th>
                <th>حالة الحفظ</th>
            </tr>
        </thead>
        <tbody id="organismsTableBody">
            <tr><td colspan="6" style="text-align:center;">جاري تحميل البيانات...</td></tr>
        </tbody>
    </table>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://rmqtopxawrrgntcqqnpa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcXRvcHhhd3JyZ250Y3FxbnBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3OTIxMzQsImV4cCI6MjA5ODM2ODEzNH0.HoExHY9oNFdryWUC2u2UELLPfBNhH3P4L3zS03dvELA';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allOrganisms = [];

        async function fetchOrganisms() {
            // جلب البيانات مع تجاوز حد 1000 نتيجة (حتى 10,000 سجل)
            const { data, error } = await supabase
                .from('organisms')
                .select('*')
                .range(0, 9999);

            if (error) {
                console.error(error);
                return;
            }
            allOrganisms = data;
            renderTable(allOrganisms);
        }

        function renderTable(items) {
            const tbody = document.getElementById('organismsTableBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">لا توجد بيانات مسجلة.</td></tr>';
                return;
            }

            items.forEach((org, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><a href="organism.html?id=${org.id}" style="color:#0066cc; text-decoration:none; font-weight:bold;">${org.name_ar || 'بدون اسم'}</a></td>
                    <td class="scientific-col">${org.scientific_name || ''}</td>
                    <td>${org.kingdom || '-'}</td>
                    <td>${org.class || '-'}</td>
                    <td>${org.conservation_status || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allOrganisms.filter(o => 
                (o.name_ar && o.name_ar.toLowerCase().includes(term)) || 
                (o.scientific_name && o.scientific_name.toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        fetchOrganisms();
    </script>
</body>
</html>
